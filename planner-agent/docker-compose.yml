version: "3.8"

services:
  # ===== Ollama — Local LLM Server =====
  ollama:
    image: ollama/ollama:latest
    container_name: guidni-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ===== One-shot: Pull the model on first launch =====
  ollama-setup:
    image: ollama/ollama:latest
    container_name: guidni-ollama-setup
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:32b}"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

  # ===== Planner Agent — Python FastAPI =====
  planner-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guidni-planner-agent
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:32b}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:0000@host.docker.internal:5432/guidni_db}
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      - DEFAULT_REGION=${DEFAULT_REGION:-Djerba}
    volumes:
      - ./app:/code/app  # Hot reload in dev
    restart: unless-stopped

volumes:
  ollama_data:
